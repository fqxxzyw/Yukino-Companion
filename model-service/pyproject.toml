[build-system]
requires = ["setuptools>=78"]
build-backend = "setuptools.build_meta"
[project]
name = "yukino-model-service"
version = "0.2.0"
requires-python = ">=3.10,<3.14"
dependencies = ["beautifulsoup4==4.14.3", "fastapi==0.128.0", "uvicorn==0.40.0", "httpx==0.28.1", "psutil==7.2.1", "huggingface_hub==0.36.2"]
[project.optional-dependencies]
train = ["torch>=2.6,<2.9", "transformers==4.57.6", "peft==0.18.1", "accelerate==1.12.0"]
qlora = ["bitsandbytes==0.49.1; platform_system == 'Linux'"]
test = ["pytest==9.0.2"]
[project.scripts]
yuki-model = "yuki_model.cli:main"
[tool.setuptools.packages.find]
include = ["yuki_model*"]
[tool.pytest.ini_options]
testpaths = ["tests"]
