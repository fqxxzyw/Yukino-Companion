name: Windows installer candidate
'on':
  push:
    branches: [handoff/codex-current-20261028]
    paths-ignore: ['docs/**', '**.md']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: windows-candidate-${{ github.ref }}
  cancel-in-progress: false
jobs:
  candidate:
    runs-on: windows-2022
    timeout-minutes: 45
    env:
      YUKINO_BASE_BUILD: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci --no-audit --no-fund
      - name: Public source regression
        run: |
          npm test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m unittest discover -s tests -p '*_test.py'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --test community/tests/*.test.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Prepare pinned download helper and application resource catalog
        run: |
          python scripts/prepare-aria2.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/mirror-resources.py --runtime-catalog-only
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build application with seven outfits and seventeen verified visual variants
        run: |
          node scripts/build-base-app.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/base-payload.cjs record build/base-app build/base-payload.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Confirm build preparation did not alter tracked source
        run: git diff --exit-code
      - name: Compile real Setup.exe with the pinned signed Inno toolchain
        run: ./scripts/build-base-installer.ps1
      - name: Install, launch, upgrade, verify payload and uninstall on this disposable worker
        run: ./scripts/smoke-base-installer.ps1 -PayloadManifest build/base-payload.json
      - name: Verify bundled downloader over HTTPS
        run: node scripts/smoke-aria2.cjs
      - name: Record source and installer identity after native checks
        run: |
          $exe = Get-Item release/Yukino-Companion-0.4.0-Base-Setup.exe
          $sha = (Get-FileHash $exe.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          $smoke = Get-Content build/base-installer-review/report.json -Raw | ConvertFrom-Json
          if ($smoke.passed -ne $true) { throw 'Native installer validation did not pass' }
          $source = @{
            commit = $env:GITHUB_SHA
            tree = (git rev-parse 'HEAD^{tree}')
            runId = $env:GITHUB_RUN_ID
            installer = $exe.Name
            bytes = $exe.Length
            sha256 = $sha
            appAsarSha256 = (Get-FileHash build/base-app/resources/app.asar -Algorithm SHA256).Hash.ToLowerInvariant()
            signatureStatus = [string](Get-AuthenticodeSignature $exe.FullName).Status
            nativeInstallLaunchUpgradeUninstall = $true
            completeFeatureAcceptance = $false
          }
          $source | ConvertTo-Json -Depth 5 | Set-Content release/candidate-source.json -Encoding utf8
          "$sha  $($exe.Name)" | Set-Content release/SHA256SUMS.txt -Encoding utf8
      - name: Upload tested installer and exact payload identity
        uses: actions/upload-artifact@v4
        with:
          name: Yukino-Windows-Setup-${{ github.sha }}
          path: |
            release/Yukino-Companion-0.4.0-Base-Setup.exe
            release/base-installer.json
            release/candidate-source.json
            release/SHA256SUMS.txt
            build/base-package.json
            build/base-payload.json
          if-no-files-found: error
          retention-days: 30
      - name: Preserve native screenshots and failure evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Yukino-Windows-evidence-${{ github.sha }}
          path: build/base-installer-review
          if-no-files-found: warn
          retention-days: 30
