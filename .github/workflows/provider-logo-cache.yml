name: Check official provider icon downloads
on:
  push:
    branches: [candidate/provider-logo-cache-20261030]
permissions:
  contents: read
jobs:
  official_icons:
    runs-on: windows-2022
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Inspect fixed official pages for icon source metadata
        run: node scripts/inspect-provider-icon-sources.cjs
      - name: Download fixed official icons and record each result
        shell: pwsh
        run: |
          node scripts/cache-provider-logos.cjs --allow-missing
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $manifest = Get-Content public/provider-logos/manifest.json -Raw | ConvertFrom-Json
          $manifest.brands | ConvertTo-Json -Depth 5 | Write-Host
          $missing = @($manifest.brands.PSObject.Properties | Where-Object { $_.Value.status -eq 'missing' } | ForEach-Object { $_.Name })
          "Official icon download failures: $($missing -join ', '). No UI, service, API or hardware validation was performed." | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
      # Only static public vendor icons and their source/hash manifest are kept.
      # No user wallpaper, character models, credentials or app profile is read.
      - name: Preserve only official icon results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Yukino-official-provider-icons-${{ github.sha }}
          path: |
            public/provider-logos/*
            build/provider-icon-sources.json
          if-no-files-found: error
          retention-days: 30
