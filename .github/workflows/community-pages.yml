name: Yukino community · GitHub Pages
on:
  push:
    branches: [main]
    paths:
      - 'community/**'
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/workflows/community-pages.yml'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: community-pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Check data, safe rendering, links and submission routes
        run: node --test community/tests/*.test.mjs
      - name: Build the static community
        run: node community/build.mjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/community
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy community
        id: deployment
        uses: actions/deploy-pages@v4
