name: Verify official CUDA dependency installation
on:
  push:
    branches: [candidate/feedback-20261030-safe]
permissions:
  contents: read
jobs:
  official_dependencies:
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci --no-audit --no-fund
      - name: Prepare the pinned base runtime catalog
        run: python scripts/mirror-resources.py --runtime-catalog-only
      - name: Install official CUDA packages in a fresh resource directory
        run: node scripts/verify-official-runtime.cjs --catalog build/base-resource-catalog/runtime-catalog.json --directory build/official-runtime-qa --flavor cu124
      - name: Preserve dependency verification and installation logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: official-runtime-installation-${{ github.sha }}
          path: |
            build/official-runtime-qa/official-runtime-qa.json
            build/official-runtime-qa/runtime/official-install.log
          if-no-files-found: warn
          retention-days: 30
