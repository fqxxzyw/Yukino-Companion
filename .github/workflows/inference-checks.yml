name: Desktop integration checks (no packaging)
on:
  push:
    branches: [main, 'integration/**', 'fix/**']
  pull_request:
    paths:
      - 'electron/**'
      - 'src/**'
      - 'inference/**'
      - 'translation/**'
      - 'scripts/**'
      - 'resources/**'
      - 'tests/**'
      - 'characters/**'
      - 'public/**'
      - 'model-window.html'
      - 'vite.config.js'
      - 'package*.json'
      - '.github/workflows/**'
permissions:
  contents: read
jobs:
  checks:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      # Ubuntu's innoextract 1.9 cannot read this 6.7.3 installer. Use a
      # pinned, unmerged compatibility change only as a CI build tool.
      - name: Check out pinned Inno Setup 6.7 compatibility tool
        if: runner.os == 'Linux'
        uses: actions/checkout@v4
        with:
          repository: dscho/innoextract
          ref: 376a13e7c41cc5528b6088d0dd16ec1b323a8d37
          path: build/innoextract-source
          persist-credentials: false
      - name: Build pinned installer extractor on Linux
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C build/innoextract-source rev-parse HEAD)" = 376a13e7c41cc5528b6088d0dd16ec1b323a8d37
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build libboost-filesystem-dev libboost-iostreams-dev libboost-date-time-dev libboost-system-dev libboost-program-options-dev liblzma-dev libbz2-dev zlib1g-dev
          cmake -S build/innoextract-source -B build/innoextract-build -G Ninja -DUSE_LTO=OFF
          cmake --build build/innoextract-build --target innoextract --parallel 2
          test -x "$GITHUB_WORKSPACE/build/innoextract-build/innoextract"
          echo "$GITHUB_WORKSPACE/build/innoextract-build" >> "$GITHUB_PATH"
      - name: Recover verified character inputs on Linux
        if: runner.os == 'Linux'
        shell: bash
        run: bash scripts/restore-character-inputs-linux.sh
      - name: Recover verified character inputs on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/restore-character-inputs-windows.ps1
      - run: npm test
      - name: Report unavailable private blink-review fixture
        if: always()
        shell: bash
        run: |
          if [[ ! -f review-assets/Yukino06_BilateralBlink_REVIEW.glb ]]; then
            echo 'Seven private blink-review asset tests skipped; all other tests execute.' | tee -a "$GITHUB_STEP_SUMMARY"
          fi
      - run: python -m unittest discover -s tests -p '*_test.py'
      - run: npm run build
        env:
          YUKINO_BASE_BUILD: '1'
      - name: Install Electron for isolated Windows renderer checks
        id: electron_runtime
        if: runner.os == 'Windows'
        run: node node_modules/electron/install.js
      - name: Check actual desktop UI with isolated synthetic settings
        if: runner.os == 'Windows'
        run: npm run qa:ui
        timeout-minutes: 5
      - name: Render digest-pinned character models with no network
        if: runner.os == 'Windows'
        run: npm run qa:models
        timeout-minutes: 7
      - name: Prove eight-weight WebGL shader paths with independent readbacks
        if: always() && runner.os == 'Windows' && steps.electron_runtime.outcome == 'success'
        run: npm run qa:skin8
        timeout-minutes: 5
      - name: Preserve Windows model and skinning renderer evidence
        if: always() && runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: windows-model-renderer-${{ github.run_number }}
          path: |
            build/model-ui-review
            build/eight-weight-skinning-review
            build/ui-review
          if-no-files-found: warn
      # Source/renderer gate only. Packaging and Release publication remain separately reviewed.
