name: Manual Windows release (packaging paused)
on:
  workflow_dispatch:
    inputs:
      confirm_publish:
        description: 'Only enable after the user resumes EXE packaging'
        type: boolean
        default: false
      runtime_flavor:
        description: 'Embedded PyTorch runtime (CPU universal / NVIDIA CUDA 12.4)'
        type: choice
        options: [cpu, cu124]
        default: cpu
permissions:
  contents: write
jobs:
  release:
    if: ${{ inputs.confirm_publish == true }}
    runs-on: windows-2022
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci --no-audit --no-fund
      - name: Set supported MSVC for CUDA 12.4
        if: ${{ inputs.runtime_flavor == 'cu124' }}
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0
        with:
          arch: x64
          toolset: '14.29'
      - name: Install CUDA build toolkit
        if: ${{ inputs.runtime_flavor == 'cu124' }}
        uses: Jimver/cuda-toolkit@433d453c1fa37d10a3254452fa8e284441c9192d # v0.2.27
        with:
          cuda: '12.4.1'
          method: network
          sub-packages: '["nvcc", "cudart", "cublas", "cublas_dev", "visual_studio_integration"]'
      - name: Prepare inference runtime
        env:
          RUNTIME_FLAVOR: ${{ inputs.runtime_flavor }}
        run: python scripts/build_windows_runtime.py --flavor $env:RUNTIME_FLAVOR
      - name: Prepare pinned offline translation resources
        run: npm run prepare:translation
      - run: npm run dist:win
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
      - run: npm run verify:characters
      - name: Publish executable before post-release tests
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "v0.3.0-bilingual.${{ github.run_number }}"
          gh release create $tag release/*.exe --target "${{ github.sha }}" --title "Yukino 0.3.0 · Bilingual Companion ${{ github.run_number }}" --prerelease --notes "中日双语、日语语音衔接、桌面陪伴与时长记录。3D 资源待接入。用户音色可自选，内置已发布权重下载入口；参考音频和准确转录须单独提供。"
      - run: npm test
      - run: python -m unittest discover -s tests -p '*_test.py'
