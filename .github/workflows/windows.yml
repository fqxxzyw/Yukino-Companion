name: Windows EXE first, then tests
on:
  push:
    branches: [main]
    paths-ignore: ['docs/**', '**.md']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install --no-audit --no-fund
      - run: npm run dist:win
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
      - name: Verify bundled character resources
        run: npm run verify:characters
      - name: Publish executable before tests
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "v0.2.1-profile.${{ github.run_number }}"
          gh release create $tag release/*.exe --target "${{ github.sha }}" --title "Yukino 0.2.1 · Character Profile ${{ github.run_number }}" --prerelease --notes "人物档案更新：补齐个人资料、家庭、兴趣、能力、性格与经历；保留完整行为指导与情境示例，移除说明性前言，同步 API 角色卡。EXE 不含文本模型权重；性格专项尚未完成整轮训练，训练完成后的模型将作为独立 Release 附件发布。按既定流程先发布 EXE，再运行测试；安装包未签名，实际供应商的人格遵循程度仍需验证。"
      - name: Tests after executable publication
        run: npm test
