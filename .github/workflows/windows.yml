name: Windows EXE first, then tests
on:
  push:
    branches: [main]
    paths-ignore: ['docs/**', '**.md']
  workflow_dispatch:
    inputs:
      runtime_flavor:
        description: 'Embedded PyTorch runtime (CPU universal / CUDA 12.4)'
        type: choice
        options: [cpu, cu124]
        default: cpu
permissions:
  contents: write
jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build embedded inference runtime
        env:
          RUNTIME_FLAVOR: ${{ inputs.runtime_flavor || 'cpu' }}
        run: python scripts/build_windows_runtime.py --flavor $env:RUNTIME_FLAVOR
      - run: npm ci --no-audit --no-fund
      - run: npm run dist:win
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
      - name: Publish executable before tests
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          $tag = "v$version-inference.${{ github.run_number }}"
          gh release create $tag release/*.exe --target "${{ github.sha }}" --title "Yukino $version · Inference ${{ github.run_number }}" --prerelease --notes "语音推理预览：GPT-SoVITS 本地权重加载、GPU/CPU 检测、文字分句与顺序朗读。内嵌 Python/推理源码/FFmpeg，公共 BERT/HuBERT 可在软件内下载；GPT/SoVITS 训练权重与参考音频由用户本机选择。不包含训练。未签名；尚未用用户真实音色与 CUDA 硬件验收。配置见 docs/VOICE_INFERENCE.md。发布后的测试结果请查看 Actions。"
      - name: Tests after executable publication
        run: npm test

      - name: Worker protocol and device selection tests
        run: python -m unittest discover -s tests -p "*_test.py"
