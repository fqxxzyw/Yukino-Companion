name: Windows 0.4.0 complete model release
on:
  push:
    branches: [release/0.4.0-local]
  workflow_dispatch:
    inputs:
      confirm_publish:
        description: 'Publish EXE and complete payload before slow validation'
        type: boolean
        default: false
      release_tag:
        description: 'Existing v0.4.0 prerelease tag, or empty for v0.4.0-local.RUN'
        type: string
        default: ''
      transfer_commit:
        description: 'Exact explicitly approved transfer/persona-0.4.0 commit (required unless model URL supplied)'
        type: string
        default: ''
      local_model_url:
        description: 'Optional trained GGUF ZIP override; prefer repository secret for private URLs'
        type: string
        default: ''
permissions:
  contents: write
  actions: read
env:
  MODEL_TRANSFER_BRANCH: transfer/persona-0.4.0
  MODEL_TRANSFER_COMMIT: ${{ inputs.transfer_commit }}
  MODEL_TRANSFER_SHA256: fff8bdcb2df7f0bfa1a30d2983ca1e7498f241ee978d41a206db54ba456989e5
  MODEL_TRANSFER_BYTES: '38114354'
  RUNTIME_REUSE_RUN: '40176955172'
  RUNTIME_REUSE_COMMIT: 924c35fae9b058f75a1a56d4a9abeb98d016c024
  # CUDA driver-link fix changes the build fingerprint; rebuild both variants.
  RUNTIME_REUSE_ENABLED: 'false'
concurrency:
  group: windows-release-${{ github.ref }}
  cancel-in-progress: true
jobs:
  metadata:
    if: ${{ github.event_name == 'push' || inputs.confirm_publish }}
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - id: tag
        env:
          REQUESTED_TAG: ${{ inputs.release_tag }}
        run: |
          python - <<'PY'
          import os, re
          tag = os.environ['REQUESTED_TAG'] or 'v0.4.0-local.${{ github.run_number }}'
          if not re.fullmatch(r'v0\.4\.0[A-Za-z0-9._-]*', tag):
              raise SystemExit('Use a safe v0.4.0 release tag')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('tag=' + tag + '\n')
          PY
  source_checks:
    needs: metadata
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci --no-audit --no-fund
        id: node_dependencies
      - run: npm test
      - run: python -m unittest discover -s tests -p '*_test.py'
      - run: python -m pip install pytest
      - run: python -m pytest model-service/tests/test_desktop_worker.py -q
      - run: npm run build
      - run: npm run qa:ui
        id: main_ui_capture
        timeout-minutes: 5
      - name: Preserve completed main-window screenshots before companion checks
        if: ${{ !cancelled() && steps.main_ui_capture.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: windows-main-ui-checks-${{ github.run_number }}
          path: build/ui-review
          if-no-files-found: error
      - run: npm run qa:pet
        timeout-minutes: 5
      - name: Compile and test the bootstrap installer with tiny fixtures
        if: ${{ !cancelled() && steps.node_dependencies.outcome == 'success' }}
        run: |
          choco install nsis --version=3.11 --yes --no-progress
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File scripts/smoke-windows-bootstrap.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-source-ui-checks-${{ github.run_number }}
          path: |
            build/ui-review
            build/pet-ui-review
            build/bootstrap-review
          if-no-files-found: warn
  model:
    needs: metadata
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      transfer_used: ${{ steps.acquire_model.outputs.transfer_used }}
    env:
      YUKINO_LOCAL_MODEL_ARCHIVE_URL: ${{ inputs.local_model_url || secrets.YUKINO_LOCAL_MODEL_ARCHIVE_URL || vars.YUKINO_LOCAL_MODEL_ARCHIVE_URL }}
      RELEASE_TAG: ${{ needs.metadata.outputs.tag }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate the explicitly authorized transfer pin
        if: env.YUKINO_LOCAL_MODEL_ARCHIVE_URL == ''
        run: |
          python - <<'PYCODE'
          import os,re
          if not re.fullmatch(r'[a-f0-9]{40}',os.environ['MODEL_TRANSFER_COMMIT']):
              raise SystemExit('The exact authorized transfer commit must be pinned before publication')
          PYCODE
      - name: Read only the approved model-transfer commit
        if: env.YUKINO_LOCAL_MODEL_ARCHIVE_URL == ''
        uses: actions/checkout@v4
        with:
          ref: ${{ env.MODEL_TRANSFER_COMMIT }}
          path: build/model-transfer
          sparse-checkout: transfer
          persist-credentials: false
      - name: Prepare native model-conversion tools
        if: env.YUKINO_LOCAL_MODEL_ARCHIVE_URL == ''
        run: sudo apt-get update && sudo apt-get install --yes cmake g++ make
      - name: Build the actual authorized trained model or verify the explicit URL override
        id: acquire_model
        run: |
          if [ -n "$YUKINO_LOCAL_MODEL_ARCHIVE_URL" ]; then
            echo "::add-mask::$YUKINO_LOCAL_MODEL_ARCHIVE_URL"
            python scripts/prepare-local-model.py
            echo 'transfer_used=false' >> "$GITHUB_OUTPUT"
          else
            python - <<'PYCODE'
          import json,os,subprocess
          from pathlib import Path
          root=Path('build/model-transfer')
          head=subprocess.check_output(['git','-C',str(root),'rev-parse','HEAD'],text=True).strip()
          if head != os.environ['MODEL_TRANSFER_COMMIT']: raise SystemExit('Transfer checkout does not match the approved commit')
          manifest=json.loads((root/'transfer/model-parts.json').read_text())
          expected={'name':'Yukino-Persona-LoRA-0.4.0.zip','bytes':int(os.environ['MODEL_TRANSFER_BYTES']),'sha256':os.environ['MODEL_TRANSFER_SHA256']}
          if manifest['archive'] != expected or len(manifest['parts']) != 73:
              raise SystemExit('Transfer metadata does not match the exact authorized LoRA archive')
          PYCODE
            python scripts/build-release-local-model.py --transfer build/model-transfer/transfer --output resources/local-model/yukino-1.5b-persona-q4
            echo 'transfer_used=true' >> "$GITHUB_OUTPUT"
          fi
      - name: Archive the verified model for Windows and separate Release downloads
        run: |
          python - <<'PYCODE'
          from pathlib import Path
          from zipfile import ZipFile, ZIP_DEFLATED
          root=Path('resources/local-model/yukino-1.5b-persona-q4'); Path('build/model-distribution').mkdir(parents=True,exist_ok=True)
          with ZipFile('build/model-distribution/Yukino-Local-1.5B-Persona-0.4.0.zip','w',compression=ZIP_DEFLATED,allowZip64=True) as bundle:
              for source in sorted(root.rglob('*')):
                  if source.is_file(): bundle.write(source,source.relative_to(root))
          PYCODE
      - uses: actions/upload-artifact@v4
        with:
          name: actual-trained-local-model
          path: build/model-distribution/*
          compression-level: 0
          if-no-files-found: error
          retention-days: 7
  runtime_cpu:
    name: runtime (cpu)
    needs: metadata
    runs-on: windows-2022
    timeout-minutes: 60
    env:
      RUNTIME_FLAVOR: cpu
      RELEASE_TAG: ${{ needs.metadata.outputs.tag }}
      PYTHONUTF8: '1'
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check the exact previously validated runtime build
        id: reuse_probe
        if: env.RUNTIME_REUSE_ENABLED == 'true'
        run: python scripts/reuse-runtime.py --probe --source-run $env:RUNTIME_REUSE_RUN --source-commit $env:RUNTIME_REUSE_COMMIT --flavor $env:RUNTIME_FLAVOR --probe-json "build/runtime-reuse-probe-$env:RUNTIME_FLAVOR.json"
      - name: Download only the pinned successful runtime artifact
        if: steps.reuse_probe.outputs.reuse == 'true'
        uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ steps.reuse_probe.outputs.artifact_id }}
          run-id: ${{ env.RUNTIME_REUSE_RUN }}
          repository: fqxxzyw/Yukino-Companion
          github-token: ${{ github.token }}
          merge-multiple: true
          path: build/runtime-distribution
      - name: Verify every reused runtime byte, build fingerprint and new Release URLs
        id: reuse_verify
        if: steps.reuse_probe.outputs.reuse == 'true'
        run: python scripts/reuse-runtime.py --verify --directory build/runtime-distribution --flavor $env:RUNTIME_FLAVOR --tag $env:RELEASE_TAG --probe-json "build/runtime-reuse-probe-$env:RUNTIME_FLAVOR.json"
      - name: Set supported MSVC for CUDA 12.4
        if: ${{ env.RUNTIME_FLAVOR == 'cu124' && steps.reuse_probe.outputs.reuse != 'true' }}
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756
        with:
          arch: x64
          toolset: '14.29'
      - name: Install CUDA build toolkit
        if: ${{ env.RUNTIME_FLAVOR == 'cu124' && steps.reuse_probe.outputs.reuse != 'true' }}
        timeout-minutes: 25
        run: ./scripts/install-cuda-toolkit.ps1
      - name: Build shared Python and both inference engines
        id: runtime_build
        if: steps.reuse_probe.outputs.reuse != 'true'
        run: python scripts/build_windows_runtime.py --flavor $env:RUNTIME_FLAVOR
      - name: Package independent runtime ZIP64 parts
        id: runtime_package
        if: steps.reuse_probe.outputs.reuse != 'true'
        run: python scripts/package-runtime.py --flavor $env:RUNTIME_FLAVOR --tag $env:RELEASE_TAG
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() && (steps.runtime_package.outcome == 'success' || steps.reuse_verify.outcome == 'success') }}
        with:
          name: inference-runtime-${{ env.RUNTIME_FLAVOR }}
          path: build/runtime-distribution/*
          compression-level: 0
          if-no-files-found: error
          retention-days: 7
  runtime_cuda:
    name: runtime (cu124)
    needs: metadata
    runs-on: windows-2022
    timeout-minutes: 120
    env:
      RUNTIME_FLAVOR: cu124
      RELEASE_TAG: ${{ needs.metadata.outputs.tag }}
      PYTHONUTF8: '1'
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check the exact previously validated runtime build
        id: reuse_probe
        if: env.RUNTIME_REUSE_ENABLED == 'true'
        run: python scripts/reuse-runtime.py --probe --source-run $env:RUNTIME_REUSE_RUN --source-commit $env:RUNTIME_REUSE_COMMIT --flavor $env:RUNTIME_FLAVOR --probe-json "build/runtime-reuse-probe-$env:RUNTIME_FLAVOR.json"
      - name: Download only the pinned successful runtime artifact
        if: steps.reuse_probe.outputs.reuse == 'true'
        uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ steps.reuse_probe.outputs.artifact_id }}
          run-id: ${{ env.RUNTIME_REUSE_RUN }}
          repository: fqxxzyw/Yukino-Companion
          github-token: ${{ github.token }}
          merge-multiple: true
          path: build/runtime-distribution
      - name: Verify every reused runtime byte, build fingerprint and new Release URLs
        id: reuse_verify
        if: steps.reuse_probe.outputs.reuse == 'true'
        run: python scripts/reuse-runtime.py --verify --directory build/runtime-distribution --flavor $env:RUNTIME_FLAVOR --tag $env:RELEASE_TAG --probe-json "build/runtime-reuse-probe-$env:RUNTIME_FLAVOR.json"
      - name: Set supported MSVC for CUDA 12.4
        if: ${{ env.RUNTIME_FLAVOR == 'cu124' && steps.reuse_probe.outputs.reuse != 'true' }}
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756
        with:
          arch: x64
          toolset: '14.29'
      - name: Install CUDA build toolkit
        if: ${{ env.RUNTIME_FLAVOR == 'cu124' && steps.reuse_probe.outputs.reuse != 'true' }}
        timeout-minutes: 25
        run: ./scripts/install-cuda-toolkit.ps1
      - name: Build shared Python and both inference engines
        id: runtime_build
        if: steps.reuse_probe.outputs.reuse != 'true'
        run: python scripts/build_windows_runtime.py --flavor $env:RUNTIME_FLAVOR
      - name: Package independent runtime ZIP64 parts
        id: runtime_package
        if: steps.reuse_probe.outputs.reuse != 'true'
        run: python scripts/package-runtime.py --flavor $env:RUNTIME_FLAVOR --tag $env:RELEASE_TAG
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() && (steps.runtime_package.outcome == 'success' || steps.reuse_verify.outcome == 'success') }}
        with:
          name: inference-runtime-${{ env.RUNTIME_FLAVOR }}
          path: build/runtime-distribution/*
          compression-level: 0
          if-no-files-found: error
          retention-days: 7
  release:
    needs: [metadata, source_checks, runtime_cpu, model]
    runs-on: windows-2022
    timeout-minutes: 180
    env:
      RELEASE_TAG: ${{ needs.metadata.outputs.tag }}
      PYTHONUTF8: '1'
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci --no-audit --no-fund
      - uses: actions/download-artifact@v4
        with:
          name: inference-runtime-cpu
          path: build/runtime-distribution
      - uses: actions/download-artifact@v4
        with:
          name: actual-trained-local-model
          path: build/model-distribution
      - name: Prepare the available CPU runtime catalog and verify actual trained GGUF
        run: |
          python scripts/package-runtime.py --merge build/runtime-distribution/runtime-catalog-cpu.json --output build/runtime-distribution
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/prepare-local-model.py --archive build/model-distribution/Yukino-Local-1.5B-Persona-0.4.0.zip
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Prepare translation, default voice, reference and complete pet
        run: |
          npm run prepare:translation
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run prepare:voice
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run dist:win
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
      - name: Verify all bundled resources and build full ZIP64 payload
        run: |
          npm run verify:characters
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run verify:offline
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/package-app-payload.py --tag $env:RELEASE_TAG
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build small installer with progress and cancellation
        run: |
          choco install nsis --version=3.11 --yes --no-progress
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run package:bootstrap
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/verify-release-assets.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Publish EXE first and mark full validation pending
        run: |
          Copy-Item docs/releases/v0.4.0.md build/release-notes.md
          Add-Content build/release-notes.md "`n**验证状态：待用户验收。** EXE 与完整模型分卷已完成基础完整性检查，公共环境不内嵌；当前提供 CPU 环境下载，CUDA 后续随更新提供。自动检查将独立继续。构建：${{ github.sha }} · [验证记录](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})。"
          gh release view $env:RELEASE_TAG --repo '${{ github.repository }}' *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create $env:RELEASE_TAG release/Yukino-Companion-0.4.0-Setup.exe --target '${{ github.sha }}' --title 'Yukino Companion 0.4.0 · 本地对话与完整桌宠' --prerelease --notes-file build/release-notes.md
          } else {
            gh release upload $env:RELEASE_TAG release/Yukino-Companion-0.4.0-Setup.exe --clobber
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            gh release edit $env:RELEASE_TAG --prerelease --title 'Yukino Companion 0.4.0 · 本地对话与完整桌宠' --notes-file build/release-notes.md
          }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          'PUBLISHED=true' | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          $assets = @(Get-ChildItem release -File | Where-Object { $_.Name -match '\.part\d+$|\.json$|SHA256SUMS.txt$' } | ForEach-Object FullName)
          $assets += @(Get-ChildItem build/runtime-distribution,build/model-distribution -File | ForEach-Object FullName)
          gh release upload $env:RELEASE_TAG @assets --clobber
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify uploaded asset lengths and GitHub SHA-256 before completing publication
        run: |
          $remote = gh api "repos/${{ github.repository }}/releases/tags/$env:RELEASE_TAG" | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $files = @(Get-ChildItem release -File | Where-Object { $_.Name -match '\.exe$|\.part\d+$|\.json$|SHA256SUMS.txt$' })
          $files += @(Get-ChildItem build/runtime-distribution,build/model-distribution -File)
          $records = @()
          foreach ($file in $files) {
            $asset = @($remote.assets | Where-Object name -eq $file.Name)
            $digest = (Get-FileHash -LiteralPath $file.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($asset.Count -ne 1 -or $asset[0].size -ne $file.Length -or $asset[0].digest -ne "sha256:$digest") { throw "Published asset size/SHA-256 mismatch: $($file.Name)" }
            $records += @{name=$file.Name;bytes=$file.Length;sha256=$digest}
          }
          $records | ConvertTo-Json -Depth 5 | Set-Content build/published-assets.json -Encoding utf8
          gh release upload $env:RELEASE_TAG build/published-assets.json --clobber
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Mark incomplete publication honestly
        if: ${{ failure() && env.PUBLISHED == 'true' }}
        run: |
          Copy-Item docs/releases/v0.4.0.md build/release-notes.md
          Add-Content build/release-notes.md "`n**发布状态：附件上传或校验未完成。** 请暂勿据此认为完整安装包已就绪。详情见 https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }} 。"
          gh release edit $env:RELEASE_TAG --notes-file build/release-notes.md
  validation:
    needs: [metadata, release]
    runs-on: windows-2022
    timeout-minutes: 120
    env:
      RELEASE_TAG: ${{ needs.metadata.outputs.tag }}
      PYTHONUTF8: '1'
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci --no-audit --no-fund
      - uses: actions/download-artifact@v4
        with:
          name: inference-runtime-cpu
          path: build/runtime-distribution
      - name: Fetch the already published application for independent validation
        run: |
          gh release download $env:RELEASE_TAG --pattern 'Yukino-Companion-0.4.0-windows-x64.zip.part*' --pattern 'app-payload.json' --pattern 'SHA256SUMS.txt' --pattern 'release-assets.json' --dir release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run build
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Node and Python unit and integration tests after upload
        run: |
          npm test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m unittest discover -s tests -p '*_test.py'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pip install pytest
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pytest model-service/tests/test_desktop_worker.py -q
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Capture actual Electron UI
        timeout-minutes: 5
        run: npm run qa:ui
      - name: Capture actual companion UI
        timeout-minutes: 5
        run: npm run qa:pet
      - name: Install the published application parts without downloading
        run: |
          $extractor = node -p "require('7zip-bin').path7za"
          powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File scripts/install-app-payload.ps1 -Catalog release/app-payload.json -SourceDirectory release -Target "$env:GITHUB_WORKSPACE\release\win-unpacked" -Extractor $extractor -Headless -Offline
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/verify-offline-package.cjs "$env:GITHUB_WORKSPACE\release\win-unpacked\resources"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify and extract distributed CPU runtime for real inference
        run: python scripts/unpack-runtime-for-test.py --directory build/runtime-distribution --output build/verified-runtime --flavor cpu
      - name: Real local character loading and generation from the shipped GGUF
        run: node model-service/scripts/evaluate_desktop.cjs --python build/verified-runtime/python-runtime/python.exe --model release/win-unpacked/resources/local-model/yukino-1.5b-persona-q4 --output release/local-chat-windows-smoke.json
      - name: Real CPU Chinese to Japanese translation
        run: '& build/verified-runtime/python-runtime/python.exe -X utf8 release/win-unpacked/resources/translation/smoke.py --model-dir release/win-unpacked/resources/translation-models/hy-mt2-1.8b-q4 --device cpu --report release/translation-windows-smoke.json'
      - name: Real bundled Japanese speech with pinned core resources
        run: python scripts/smoke_bundled_voice.py --runtime-root build/verified-runtime --voice-root release/win-unpacked/resources/voice-models --download-core --report release/voice-smoke/report.json --audio release/voice-smoke/japanese.wav
      - name: Record successful validation
        run: |
          Copy-Item docs/releases/v0.4.0.md build/release-notes.md
          Add-Content build/release-notes.md "`n**验证状态：Windows CPU 自动检查通过，待用户验收。** Node/Python 测试、真实 Electron 与桌宠截图、分卷离线安装、发行包 CPU 中日翻译和默认音色日语合成已通过。合成确认真实加载及有效非静音 PCM，不等同于人工音质评价。此测试包提供 CPU 环境下载；CUDA 后续随更新提供，未宣称 NVIDIA 实机验收。`n[验证记录](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}) · 构建 ${{ github.sha }}。"
          gh release edit $env:RELEASE_TAG --notes-file build/release-notes.md
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Copy-Item release/voice-smoke/report.json release/voice-windows-smoke.json
          $evidence = @('release/local-chat-windows-smoke.json', 'release/translation-windows-smoke.json', 'release/voice-smoke/japanese.wav', 'release/voice-windows-smoke.json')
          $evidence += @(Get-ChildItem build/ui-review,build/pet-ui-review -Filter '*.png' | ForEach-Object FullName)
          gh release upload $env:RELEASE_TAG @evidence --clobber
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Keep an honest failed-validation status
        if: failure()
        run: |
          New-Item -ItemType Directory -Path build -Force | Out-Null
          Copy-Item docs/releases/v0.4.0.md build/release-notes.md
          Add-Content build/release-notes.md "`n**验证状态：未通过，暂不建议作为稳定版安装。** 发布后的检查失败；EXE 保留用于复现。请查看[失败步骤与证据](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})，不要将上传视为验证通过。"
          gh release edit $env:RELEASE_TAG --notes-file build/release-notes.md
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-0.4.0-evidence-${{ github.run_number }}
          path: |
            build/ui-review
            build/pet-ui-review
            release/SHA256SUMS.txt
            release/release-assets.json
            release/app-payload.json
            release/translation-windows-smoke.json
            release/local-chat-windows-smoke.json
            release/voice-smoke/report.json
            release/voice-smoke/report.stderr.log
            release/voice-smoke/japanese.wav
          if-no-files-found: warn
  cleanup_transfer:
    needs: [model, release]
    if: ${{ success() && needs.model.outputs.transfer_used == 'true' }}
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Delete only the unchanged temporary branch after successful publication
        run: |
          current="$(gh api "repos/${{ github.repository }}/git/ref/heads/$MODEL_TRANSFER_BRANCH" --jq '.object.sha')"
          if [ "$current" = "$MODEL_TRANSFER_COMMIT" ]; then
            gh api --method DELETE "repos/${{ github.repository }}/git/refs/heads/$MODEL_TRANSFER_BRANCH"
            echo 'Removed the explicitly authorized temporary transfer branch.'
          else
            echo '::warning::Temporary branch HEAD changed; it has been left untouched.'
          fi
