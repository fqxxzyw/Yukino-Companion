name: Revalidate published Windows test installer
'on':
  push:
    branches: [handoff/codex-current-20261028]
    paths:
      - '.github/workflows/windows-revalidate.yml'
      - 'scripts/verify-installed-window.cjs'
permissions:
  contents: read
  actions: read
jobs:
  validation:
    runs-on: windows-2022
    timeout-minutes: 15
    env:
      YUKINO_BASE_BUILD: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci --no-audit --no-fund
      - uses: actions/download-artifact@v4
        with:
          name: Yukino-Windows-Setup-8dee5c95512df806753d65a588f865d58a6ad711
          run-id: 40851833722
          github-token: ${{ github.token }}
          path: .
      - name: Bind the downloaded installer to the exact published candidate
        shell: bash
        run: |
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          source=json.loads(Path('release/candidate-source.json').read_text(encoding='utf-8-sig'))
          exe=Path('release/Yukino-Companion-0.4.0-Base-Setup.exe')
          with exe.open('rb') as stream: digest=hashlib.file_digest(stream,'sha256').hexdigest()
          if source['commit']!='8dee5c95512df806753d65a588f865d58a6ad711' or source['runId']!='40851833722' or source['sha256']!=digest or source['bytes']!=exe.stat().st_size or digest!='1172190ce36032f85491db8966a2f336ffe03ef46d677f6b41cef15f8c0911fd':
              raise SystemExit('Downloaded installer does not match the published candidate')
          PY
      - name: Install, render default model, upgrade and uninstall exact published installer
        timeout-minutes: 6
        run: ./scripts/smoke-base-installer.ps1 -PayloadManifest build/base-payload.json
      - name: Verify bundled downloader over HTTPS
        run: |
          python scripts/prepare-aria2.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/smoke-aria2.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Public source regression
        run: |
          npm test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m unittest discover -s tests -p '*_test.py'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --test community/tests/*.test.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Preserve native screenshots and failure evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Yukino-published-installer-revalidation-${{ github.run_id }}
          path: build/base-installer-review
          if-no-files-found: warn
          retention-days: 30
