<!doctype html>
<html lang="zh-CN"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self'; media-src 'self' file:; connect-src 'none'">
<title>Yukino · 桌面陪伴</title><link rel="stylesheet" href="view.css">
</head><body>
<main id="stage">
  <div id="bubble" class="bubble" hidden><div id="zh"></div><div id="ja" lang="ja"></div></div>
  <canvas id="pet" width="192" height="208" aria-label="雪乃桌宠，拖动移动，双击打开聊天，右键打开设置" role="img" tabindex="0"></canvas>
  <div id="model" class="model" hidden><div class="orb">Y</div><strong>人物模型位置</strong><span>3D 模型与动作正在准备</span><button id="model-open">打开对话</button></div>
  <div id="focus-badge" class="focus-badge" hidden></div>
  <section id="pet-menu" class="pet-menu" role="dialog" aria-modal="true" aria-label="桌宠设置" hidden>
    <header><div><span class="eyebrow">YOUR QUIET COMPANION</span><h2>雪乃桌宠</h2></div><button id="menu-close" class="icon-button" aria-label="关闭桌宠设置">×</button></header>
    <div id="menu-body" class="menu-body"></div><p id="menu-error" class="menu-error" role="alert" hidden></p>
  </section>
</main><script src="view.js"></script></body></html>
